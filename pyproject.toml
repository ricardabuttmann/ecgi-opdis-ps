[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opdis-ps"
version = "0.1.0"
description = "Reproducible ECGI inference examples for an anonymous paper artifact"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "torch>=2.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
opdis-run-example = "opdis_ps.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
